name: Dashboard Deploy

on:
  workflow_call:
    inputs:
      parameter_file:
        description: "Path to the parameters file"
        required: true
        type: string
    secrets:
      SHINYAPPS_SECRET:
        required: true
      SHINYAPPS_TOKEN:
        required: true
      CARTO_API_TOKEN:
        required: false

jobs:
  deployShiny:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PAT: ${{ github.token }}
      GIT_TERMINAL_PROMPT: "0"
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "false"

    container:
      image: ghcr.io/dfe-analytical-services/dfe-r-base:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure git to use GitHub token
        shell: bash
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Read parameters
        shell: bash
        run: |
          DASHBOARD_NAME=$(yq -r '.dashboard_name' "${{ inputs.parameter_file }}")
          DEPLOY_TARGET=$(yq -r '.deploy_target' "${{ inputs.parameter_file }}")
          echo "DASHBOARD_NAME=$DASHBOARD_NAME" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=$DEPLOY_TARGET" >> "$GITHUB_ENV"

      - name: Set environment variables based on branch
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "SHINYAPP_NAME=$DASHBOARD_NAME" >> "$GITHUB_ENV"
          else
            echo "SHINYAPP_NAME=dev-$DASHBOARD_NAME" >> "$GITHUB_ENV"
          fi

      - name: Restore renv snapshot
        shell: Rscript {0}
        run: |
          Sys.setenv(GITHUB_TOKEN = Sys.getenv("GITHUB_TOKEN"))
          Sys.setenv(R_REMOTES_NO_ERRORS_FROM_WARNINGS = "false")

          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")

          renv::init(bare = TRUE)
          renv::record("rsconnect")
          renv::record("dfe-analytical-services/dfeshiny@v0.7.0")
          renv::restore()
          renv::status()

      - name: Create .Renviron
        shell: bash
        run: |
          if [ -n "${{ secrets.CARTO_API_TOKEN }}" ]; then
            echo "Writing CARTO_API_TOKEN to .Renviron"
            echo "CARTO_API_TOKEN=${{ secrets.CARTO_API_TOKEN }}" > .Renviron
            ls -l .Renviron
          fi

      - name: Deploy to ShinyApps.io
        if: github.event_name != 'pull_request'
        shell: Rscript {0}
        run: |
          Sys.setenv(GITHUB_TOKEN = Sys.getenv("GITHUB_TOKEN"))
          Sys.setenv(R_REMOTES_NO_ERRORS_FROM_WARNINGS = "false")

          rsconnect::setAccountInfo(
            name = 'department-for-education',
            token = '${{ secrets.SHINYAPPS_TOKEN }}',
            secret = '${{ secrets.SHINYAPPS_SECRET }}'
          )

          rsconnect::deployApp(
            appName = '${{ env.SHINYAPP_NAME }}',
            forceUpdate = TRUE, 
            envVars = c('GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}')
          )
