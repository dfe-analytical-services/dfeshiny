name: Dashboard Deploy

on:
  workflow_call:
    inputs:
      parameter_file:
        description: "Path to the parameters file"
        required: true
        type: string
    secrets:
      SHINYAPPS_SECRET:
        required: true
      SHINYAPPS_TOKEN:
        required: true
      CARTO_API_TOKEN:
        required: false

jobs:
  deployShiny:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PAT: ${{ github.token }}
      GIT_TERMINAL_PROMPT: "0"
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "false"

    container:
      image: ghcr.io/dfe-analytical-services/dfe-r-base:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure git to use GitHub token
        shell: bash
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check GitHub access before restore
        shell: bash
        run: |
          echo "GITHUB_TOKEN present: ${GITHUB_TOKEN:+yes}"
          echo "GITHUB_PAT present: ${GITHUB_PAT:+yes}"

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/rate_limit

          git ls-remote --heads https://github.com/dfe-analytical-services/dfeshiny.git | sed -n '1,5p'

      - name: Read parameters
        shell: bash
        run: |
          DASHBOARD_NAME=$(yq -r '.dashboard_name' "${{ inputs.parameter_file }}")
          DEPLOY_TARGET=$(yq -r '.deploy_target' "${{ inputs.parameter_file }}")
          echo "DASHBOARD_NAME=$DASHBOARD_NAME" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=$DEPLOY_TARGET" >> "$GITHUB_ENV"

      - name: Set environment variables based on branch
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "SHINYAPP_NAME=$DASHBOARD_NAME" >> "$GITHUB_ENV"
          else
            echo "SHINYAPP_NAME=dev-$DASHBOARD_NAME" >> "$GITHUB_ENV"
          fi

      - name: Restore renv snapshot
        shell: Rscript {0}
        run: |
          Sys.setenv(GITHUB_TOKEN = Sys.getenv("GITHUB_TOKEN"))
          Sys.setenv(GITHUB_PAT = Sys.getenv("GITHUB_PAT"))
          Sys.setenv(R_REMOTES_NO_ERRORS_FROM_WARNINGS = "false")
          options(timeout = 600)

          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")

          # direct check of the package source before renv restore
          remotes::install_github(
            "dfe-analytical-services/dfeshiny",
            upgrade = "never",
            auth_token = Sys.getenv("GITHUB_TOKEN"),
            quiet = FALSE
          )

          renv::init(bare = TRUE)
          renv::restore()
          renv::status()

      - name: Install rsconnect
        shell: Rscript {0}
        run: |
          Sys.setenv(GITHUB_TOKEN = Sys.getenv("GITHUB_TOKEN"))
          Sys.setenv(GITHUB_PAT = Sys.getenv("GITHUB_PAT"))
          if (!requireNamespace("rsconnect", quietly = TRUE)) {
            install.packages("rsconnect")
          }

      - name: Create .Renviron
        shell: bash
        run: |
          if [ -n "${{ secrets.CARTO_API_TOKEN }}" ]; then
            echo "Writing CARTO_API_TOKEN to .Renviron"
            echo "CARTO_API_TOKEN=${{ secrets.CARTO_API_TOKEN }}" > .Renviron
            ls -l .Renviron
          fi

      - name: Deploy to ShinyApps.io
        if: github.event_name != 'pull_request'
        shell: Rscript {0}
        run: |
          Sys.setenv(GITHUB_TOKEN = Sys.getenv("GITHUB_TOKEN"))
          Sys.setenv(GITHUB_PAT = Sys.getenv("GITHUB_PAT"))
          Sys.setenv(R_REMOTES_NO_ERRORS_FROM_WARNINGS = "false")

          rsconnect::setAccountInfo(
            name = 'department-for-education',
            token = '${{ secrets.SHINYAPPS_TOKEN }}',
            secret = '${{ secrets.SHINYAPPS_SECRET }}'
          )

          rsconnect::deployApp(
            appName = '${{ env.SHINYAPP_NAME }}',
            forceUpdate = TRUE
          )
